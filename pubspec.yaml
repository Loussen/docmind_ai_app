name: docmind_ai
description: DocMind AI — Smart Document Summarizer
publish_to: 'none'
version: 1.0.6+7

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Network
  dio: ^5.4.0
  retrofit: ^4.0.3
  
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # File Handling
  file_picker: ^8.0.0
  path_provider: ^2.1.1
  url_launcher: ^6.2.2
  share_plus: ^10.1.4
  image_picker: ^1.0.7
  
  # Device Info (required for privacy manifest)
  device_info_plus: ^11.2.0
  
  # Document Processing
  syncfusion_flutter_pdf: ^28.1.38
  syncfusion_flutter_pdfviewer: ^28.1.38
  
  # Authentication (Firebase removed - using backend API)
  sign_in_with_apple: ^6.0.0
  
  # In-App Purchases
  in_app_purchase: ^3.1.13
  
  # UI Components
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0
  animate_do: ^3.1.2
  
  # Navigation
  go_router: ^13.0.1
  
  # Utils
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  intl: ^0.18.1
  equatable: ^2.0.5
  dartz: ^0.10.1
  uuid: ^4.2.2
  
  # Icons
  cupertino_icons: ^1.0.6
  iconsax: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  retrofit_generator: ^8.0.6
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  ios: true
  image_path: "assets/icon/appstore.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/appstore.png"

flutter:
  uses-material-design: true
  
  # Uncomment and add your assets when ready
  # assets:
  #   - assets/images/
  #   - assets/icons/
  #   - assets/animations/
  
  # Uncomment and add SF Pro Display fonts when available
  # fonts:
  #   - family: SF Pro Display
  #     fonts:
  #       - asset: assets/fonts/SF-Pro-Display-Regular.otf
  #       - asset: assets/fonts/SF-Pro-Display-Medium.otf
  #         weight: 500
  #       - asset: assets/fonts/SF-Pro-Display-Semibold.otf
  #         weight: 600
  #       - asset: assets/fonts/SF-Pro-Display-Bold.otf
  #         weight: 700
